name: Test Telegram Auto-Ad Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Auto-Ad Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          TARGET_CHATS: ${{ secrets.TARGET_CHATS }}
          SUPPORT_URL: ${{ secrets.SUPPORT_URL }}
          NETWORK_URL: ${{ secrets.NETWORK_URL }}
          PAYMENT_INFO: ${{ secrets.PAYMENT_INFO }}
          PRICE_7: ${{ secrets.PRICE_7 }}
          PRICE_30: ${{ secrets.PRICE_30 }}
          MAX_SLOTS: ${{ secrets.MAX_SLOTS }}
          REPOST_HOURS: ${{ secrets.REPOST_HOURS }}
          REF_PERCENT: ${{ secrets.REF_PERCENT }}
          WELCOME_IMAGE: ${{ secrets.WELCOME_IMAGE }}
        run: python -u bot.py
        
